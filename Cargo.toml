[workspace]
resolver = "3"
members = [
    "crates/ve-core",
    "crates/ve-render",
    "crates/ve-grib",
    "crates/ve-zarr",
    "crates/ve-chart",
    "crates/ve-osm",
    "crates/ve-app",
    "tools/basemap-builder",
    "tools/icon-grid-builder",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/jweisbaum/VectorEffects"

[workspace.dependencies]
ve-core = { path = "crates/ve-core" }
ve-grib = { path = "crates/ve-grib" }
ve-render = { path = "crates/ve-render" }
ve-zarr = { path = "crates/ve-zarr" }
ve-chart = { path = "crates/ve-chart" }
ve-osm = { path = "crates/ve-osm" }

anyhow = "1"
# Pure-Rust decoders for the two GRIB2 packings the forecast centres ship
# that we cannot decode ourselves (spec.md 4.8). Neither pulls a C library:
# invariant 5 and the three-platform build both require that.
hayro-jpeg2000 = { version = "0.4.0", default-features = false }
rust-aec = "0.1.1"
rayon = "1.12.0"
# Already in the tree behind `zip`; used directly for the grid asset.
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release profile favours the export path, which is CPU-bound and allowed to be
# slow to compile. See spec.md 13.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dev builds still need the evaluator to be usable interactively.
#
# `profile.dev.package."*"` covers dependencies only -- it does *not* reach the
# workspace's own crates, which is where the field sampling lives. Without the
# `[profile.dev]` entry below, tile rendering ran about 2.4x slower under
# `tauri dev` than in release, for no reason anyone would guess from the config.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The app crate builds unoptimised, deliberately.
#
# At the `opt-level = 1` above, an *incremental* rebuild of `ve-app` produces an
# rlib whose codegen units reference each other's internalised `.llvm.*`
# symbols. The linker pulls archive members on demand under `-dead_strip`,
# leaves those members out, and every binary in the package then fails with
# "Undefined symbols for architecture x86_64" -- `tauri dev` included, on every
# single edit. The only recovery was deleting the rlib by hand. Reproduced on
# Rust 1.97.1, x86_64-apple-darwin: `touch` any ve-app source and rebuild.
#
# `codegen-units = 1` fixes it too, by leaving no cross-unit references to lose,
# but costs 126 s for a one-file edit against 6 s here.
#
# Nothing is given up. This crate is IPC glue: every field evaluation,
# rasterisation and geodesy call it makes is in `ve-render` or `ve-core`, which
# keep their optimisation, and the tile budgets in spec.md 13 are measured
# there. `CARGO_INCREMENTAL=0` is the other workaround, and it costs 27 s.
[profile.dev.package.ve-app]
opt-level = 0
