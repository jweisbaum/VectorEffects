[package]
name = "ve-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VectorEffects desktop application."
# Development utilities live in examples/ so Tauri bundles only the app.
default-run = "ve-app"

[lib]
name = "ve_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ve-app"
path = "src/main.rs"

[dependencies]
ve-core = { workspace = true }
ve-grib = { workspace = true }
ve-render = { workspace = true }
ve-zarr = { workspace = true }

anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The tile pipeline uses `register_uri_scheme_protocol` (ve-tile://), not the
# asset protocol, so no extra features are needed here.
tauri = { version = "2.11.5", features = [] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
directories = "6.0.0"
ts-rs = "12.0.1"
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2.7.3"
png = "0.18.1"
jpeg-decoder = "0.3.2"
tiff = "0.11.3"
# End-to-end automation, and **never in a shipped build** — see `[features]`.
tauri-plugin-webdriver-automation = { version = "0.1.3", optional = true }

[features]
# WebDriver automation for the end-to-end tests (macOS), off by default.
#
# **The plugin binds a TCP listener.** It serves an axum WebDriver endpoint on
# `127.0.0.1` at a random port, printed to stdout, and that endpoint can click,
# type, screenshot and read the DOM — the whole interface, to any process on
# the machine that reads the port. Invariant 5 says nothing is fetched that the
# user did not ask for, and an inbound socket that drives the application is
# the same promise from the other side.
#
# So it is optional, and `npm run build` does not pass it: a release bundle
# contains no `axum` and opens no port. `npm run check:offline` cannot enforce
# that — it reads source URLs, bundle references and the CSP, not listeners —
# so the enforcement is that the dependency is not compiled in at all.
#
#   npm run dev:webdriver     # the app with the endpoint
#   cargo build -p ve-app --features webdriver
webdriver = ["dep:tauri-plugin-webdriver-automation"]

[dev-dependencies]
# Reading a saved project's archive directly, to check what a capture writes.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ve-grib = { workspace = true, features = ["testing"] }
# Reading a Zarr export back, to check what the writer put where.
zarrs = { version = "0.23", default-features = false, features = ["filesystem", "zstd"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
