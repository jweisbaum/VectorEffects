[package]
name = "ve-zarr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads ERA5 wind and GlobCurrent surface current from the public Zarr archives (spec.md 4.10)."

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `default-features = false` is load-bearing. The default set turns on
# `blosc`, which builds c-blosc and its bundled Snappy through a C++
# toolchain. The stores this crate reads are blosc/lz4 only, and `blosc.rs`
# decodes that in Rust, so the C++ dependency buys nothing and costs the
# three-platform build.
zarrs = { version = "0.23", default-features = false, features = ["filesystem", "zstd"] }
zarrs_storage = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }
half = "2.7"

# The store is read over HTTPS by `http.rs` rather than by `zarrs_http`, which
# takes `reqwest` with its default features: that is `native-tls`, and on Linux
# `openssl-sys` — a system C library the three-platform build forbids. Rustls
# links no system library, and `reqwest` is already in the tree.
#
# `webpki-roots` (a bundled Mozilla root list) was dropped by reqwest 0.13.2 in
# favour of `rustls-platform-verifier`, which the `rustls` feature already
# pulls in and which reads the platform's own trust store instead — no `-sys`
# crate either way (M86: the MCP service's `rmcp` dev-dependency forces the
# unified `reqwest` version past 0.13.1, where the old feature stopped existing).
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls", "http2"] }
url = "2"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
