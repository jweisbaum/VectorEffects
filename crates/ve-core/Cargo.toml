[package]
name = "ve-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Document model, conventions, and geodesy for VectorEffects."

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
thiserror = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Content hashes for imported rasters: the render cache keys off them.
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
# Resampling an unstructured grid is a few million independent searches.
rayon = { workspace = true }
# Captured fields inside a project archive (spec.md 8.5). Pure Rust, no C
# library behind it (invariant 5), and chosen for decode speed rather than
# ratio: a capture is read every time the project opens and written once.
# `safe-decode`/`safe-encode` are the default; no `unsafe` reaches the archive.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
