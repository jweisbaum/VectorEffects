name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI has no GPU. The CPU evaluator is the reference implementation and the
  # one export uses, so this is the correct backend to test against anyway.
  VE_FORCE_CPU: "1"

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  grib:
    name: grib validated by ecCodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # An *independent* decoder. The in-repo reader checks the writer against
      # its own understanding of the format; this checks it against someone
      # else's, which is what catches a shared misreading of the spec.
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools python3-eccodes python3-numpy

      - name: Emit a sample from the real pipeline
        run: cargo run --release -p ve-app --example export_sample -- sample.grib2

      - name: ecCodes must parse every message without warnings
        run: |
          grib_ls sample.grib2
          grib_dump sample.grib2 > /dev/null
          test "$(grib_count sample.grib2)" = "6"

      - name: Decoded values must match what was painted
        run: python3 tools/check_grib.py sample.grib2

  bindings:
    name: typescript bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p ve-app --bin export-bindings
      # Bindings are generated from the Rust types and committed. If this diff
      # is non-empty, someone changed a type without regenerating.
      - name: Fail if bindings drifted
        run: git diff --exit-code -- ui/src/generated

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:test
      - run: npm run ui:build

  offline:
    name: no runtime network access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Check the built bundle too: a remote reference pulled in by a dependency
      # only becomes visible after bundling.
      - run: npm run ui:build
      - run: npm run check:offline
