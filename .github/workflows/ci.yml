name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI has no GPU. The CPU evaluator is the reference implementation and the
  # one export uses, so this is the correct backend to test against anyway.
  VE_FORCE_CPU: "1"
  # Hundreds of integration binaries otherwise exhaust the Linux runner's disk
  # while linking. Keep normal optimizations and assertions, without DWARF/PDBs.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-2022, ubuntu-22.04]
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true

      # Catch native shader/compiler failures before compiling the app tests.
      - name: Check GPU shader and field fidelity
        run: cargo test -p ve-render --lib --test empty_layers --test fidelity -- --nocapture
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      # A job's log needs a GitHub login to read; its annotations do not. So
      # what failed is said twice, and the second time anyone can see it:
      # the failing tests by name, then each panic with the line after it.
      - name: Name the tests that failed
        if: failure()
        # PowerShell, which every hosted runner has: the Windows runner's bash
        # did not have everything a text pipeline wants (exit 127).
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test.log'
          if (-not (Test-Path $log)) {
            Write-Output "::error title=No test log::$log was never written"
            exit 0
          }
          $lines = @((Get-Content $log) -replace "`e\[[0-9;]*m", '')
          $failed = @($lines | Where-Object { $_ -match '^test .* \.\.\. FAILED$' } | Select-Object -First 4)
          foreach ($line in $failed) { Write-Output "::error title=Failed test::$line" }
          $panics = 0
          for ($i = 0; $i -lt $lines.Count -and $panics -lt 5; $i++) {
            if ($lines[$i] -match 'panicked at') {
              $last = [Math]::Min($i + 2, $lines.Count - 1)
              Write-Output ("::error title=Panic::" + ($lines[$i..$last] -join '%0A'))
              $panics++
            }
          }
          # Neither: a test program that would not build, link or start.
          if ($failed.Count -eq 0 -and $panics -eq 0) {
            $tail = @($lines | Where-Object { $_.Trim() } | Select-Object -Last 15) -join '%0A'
            Write-Output "::error title=End of the test log::$tail"
          }
          exit 0
      - run: cargo build --workspace
      - name: The Windows application carries its manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-windows-manifest.ps1 -Exe target/debug/ve-app.exe

  grib:
    name: grib validated by ecCodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2

      # An *independent* decoder. The in-repo reader checks the writer against
      # its own understanding of the format; this checks it against someone
      # else's, which is what catches a shared misreading of the spec.
      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools python3-eccodes python3-numpy libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      - name: Emit a sample from the real pipeline
        run: cargo run --release -p ve-app --example export_sample -- sample.grib2 empty.grib2

      - name: ecCodes must parse every message without warnings
        run: |
          grib_ls sample.grib2
          grib_dump sample.grib2 > /dev/null
          test "$(grib_count sample.grib2)" = "6"

      - name: Decoded values must match what was painted
        run: |
          python3 tools/check_grib.py sample.grib2
          python3 tools/check_grib.py empty.grib2 --empty

  bindings:
    name: typescript bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p ve-app --example export_bindings
      # Bindings are generated from the Rust types and committed. If this diff
      # is non-empty, someone changed a type without regenerating.
      - name: Fail if bindings drifted
        run: git diff --exit-code -- ui/src/generated

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:test
      - run: npm run ui:build

  offline:
    name: no runtime network access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Check the built bundle too: a remote reference pulled in by a dependency
      # only becomes visible after bundling.
      - run: npm run ui:build
      - run: npm run check:offline
