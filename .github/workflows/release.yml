name: Release

# Builds the three platforms' bundles on a version tag and attaches them to a
# GitHub release. Signing and notarisation need secrets this repository does
# not yet hold: with `APPLE_CERTIFICATE`, `APPLE_CERTIFICATE_PASSWORD`,
# `APPLE_ID`, `APPLE_PASSWORD` and `APPLE_TEAM_ID` set, tauri-action signs
# and notarises the macOS bundle; without them it produces an unsigned one,
# which Gatekeeper will ask about and which is still the same binary.
#
# Universal macOS needs both Apple targets, which rustup provides here and the
# Homebrew toolchain on the development machine does not (CLAUDE.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ""
            targets: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Invariant 5, checked on the bundle that will ship rather than on a
      # development build.
      - run: npm run ui:build
      - run: npm run check:offline

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VectorEffects ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
