name: Release builds

# Manual runs create build artifacts. Version tags also create a draft beta
# release for review before publication. Never enable the WebDriver feature.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VE_FORCE_CPU: "1"

jobs:
  bundle:
    permissions:
      contents: write
    name: bundle / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-intel
            os: macos-15-intel
            targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --locked
          - name: mac-arm
            os: macos-15
            targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --locked
          - name: windows-x64
            os: windows-2022
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --locked
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --locked
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file xdg-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Invariant 5, checked on the bundle that will ship rather than on a
      # development build.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run bindings
      - run: git diff --exit-code -- ui/src/generated
      - run: npm run ui:test
      - run: npm run ui:build
      - run: npm run check:offline
        shell: bash

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: VectorEffects ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
